<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Workout Log</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #121212;
  --panel: #1c1c1c;
  --panel2: #232323;
  --steel: #5b8a9a;
  --steel-light: #7fb0c2;
  --text: #e8e8e4;
  --text-dim: #8a8a86;
  --rust: #c9534a;
  --line: #2e2e2e;
  --photo-red: #e5393b;
}
html { scrollbar-width: none; -ms-overflow-style: none; }
html::-webkit-scrollbar { display: none; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Barlow Condensed', sans-serif;
  min-height: 100vh; padding-bottom: 90px;
}

header {
  padding: 18px 18px 14px; border-bottom: 1px solid var(--line);
  display: flex; align-items: baseline; justify-content: space-between;
}
header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.02em; }
header .date { font-family: 'Space Mono', monospace; font-size: 0.8rem; color: var(--text-dim); }

.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tab {
  flex: 1; text-align: center; padding: 12px; font-size: 1.05rem; font-weight: 600;
  color: var(--text-dim); background: none; border: none; cursor: pointer;
  border-bottom: 2px solid transparent;
}
.tab.active { color: var(--steel-light); border-bottom-color: var(--steel); }

#log, #history, #progress, #photo { padding: 16px; }
#history, #progress, #photo { display: none; }

.progress-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  margin-bottom: 14px; padding: 14px;
}
.progress-card .p-name { font-size: 1.2rem; font-weight: 600; margin-bottom: 2px; }
.progress-card .p-change {
  font-family: 'Space Mono', monospace; font-size: 0.8rem; color: var(--steel-light); margin-bottom: 10px;
}
.progress-card .p-change.flat { color: var(--text-dim); }
.progress-card svg { width: 100%; height: 70px; display: block; }
.progress-card .p-points {
  display: flex; justify-content: space-between; font-family: 'Space Mono', monospace;
  font-size: 0.68rem; color: var(--text-dim); margin-top: 4px;
}

.heatmap-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  margin-bottom: 14px; padding: 14px;
}
.heatmap-year { margin-bottom: 14px; }
.heatmap-year:last-of-type { margin-bottom: 8px; }
.heatmap-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.heatmap-head .hm-year { font-size: 1.5rem; font-weight: 700; }
.heatmap-head .hm-count { font-family: 'Space Mono', monospace; font-size: 0.75rem; color: var(--text-dim); }
.heatmap-year svg { width: 100%; height: auto; display: block; }
.hm-on { fill: var(--steel-light); }
.hm-off { fill: #2a2a2a; }
.hm-future { fill: #1e1e1e; }
.hm-month { fill: var(--text-dim); font-family: 'Barlow Condensed', sans-serif; font-size: 13px; }
.heatmap-legend {
  display: flex; gap: 16px; justify-content: flex-end; font-size: 0.85rem; color: var(--text-dim);
  font-family: 'Barlow Condensed', sans-serif;
}
.heatmap-legend span { display: inline-flex; align-items: center; gap: 6px; }
.heatmap-legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

.day-buttons {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px;
}
.day-buttons::-webkit-scrollbar { display: none; }
.day-btn {
  flex: 0 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  color: var(--text-dim); font-family: 'Barlow Condensed', sans-serif; font-weight: 600;
  font-size: 0.95rem; padding: 9px 14px; white-space: nowrap; cursor: pointer;
}
.day-btn:active { border-color: var(--steel); color: var(--steel-light); }

.exercise {
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  margin-bottom: 14px; overflow: hidden;
}
.exercise-head {
  padding: 12px 14px; display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--line);
}
.exercise-head h3 { font-size: 1.25rem; font-weight: 600; }
.exercise-head .last-time { font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }
.remove-ex { background: none; border: none; color: var(--rust); font-size: 1.3rem; cursor: pointer; padding: 4px 8px; }

.set-row {
  display: grid; grid-template-columns: 28px 1fr 1fr 26px 30px; gap: 8px; align-items: center;
  padding: 10px 14px; border-bottom: 1px solid var(--line);
}
.set-row:last-child { border-bottom: none; }
.set-num { font-family: 'Space Mono', monospace; color: var(--text-dim); font-size: 0.85rem; }
.set-row input {
  width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 3px;
  color: var(--text); font-family: 'Space Mono', monospace; font-size: 1.1rem;
  padding: 8px 6px; text-align: center;
}
.set-row input:focus { outline: none; border-color: var(--steel); }
.set-row .unit { font-size: 0.65rem; color: var(--text-dim); display: block; text-align: center; margin-top: 2px; }
.remove-set { background: none; border: none; color: var(--text-dim); font-size: 1.1rem; cursor: pointer; }

.add-set-btn {
  width: 100%; padding: 10px; background: none; border: none; color: var(--steel-light);
  font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 600; cursor: pointer;
}

.add-exercise-row { display: flex; gap: 8px; margin-top: 4px; margin-bottom: 20px; }
.add-exercise-row input {
  flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  color: var(--text); font-family: 'Barlow Condensed', sans-serif; font-size: 1.1rem;
  padding: 12px 14px;
}
.add-exercise-row input:focus { outline: none; border-color: var(--steel); }
.add-exercise-row button {
  background: var(--steel); color: #0d0d0d; border: none; border-radius: 4px;
  padding: 0 20px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 1.1rem; cursor: pointer;
}

.finish-bar {
  position: fixed; bottom: 0; left: 0; right: 0; padding: 14px 18px;
  background: var(--bg); border-top: 1px solid var(--line);
}
.finish-bar button {
  width: 100%; padding: 14px; background: var(--steel); color: #0d0d0d; border: none;
  border-radius: 4px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 1.2rem; letter-spacing: 0.02em; cursor: pointer;
}
.finish-bar button:disabled { background: var(--line); color: var(--text-dim); }

.empty-state { text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 1.05rem; }

.history-session {
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  margin-bottom: 12px; padding: 14px;
}
.history-session .h-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.history-session .h-date { font-family: 'Space Mono', monospace; color: var(--steel-light); font-size: 0.85rem; }
.edit-session-btn {
  background: none; border: 1px solid var(--steel); color: var(--steel-light); border-radius: 3px;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 0.78rem;
  padding: 5px 10px; cursor: pointer;
}
.history-ex { margin-bottom: 8px; }
.history-ex .h-name { font-size: 1.1rem; font-weight: 600; }
.history-ex .h-sets { font-family: 'Space Mono', monospace; color: var(--text-dim); font-size: 0.82rem; }

/* Photo tab */
.photo-field { margin-bottom: 14px; }
.photo-field label {
  display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 6px;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 600; letter-spacing: 0.02em;
}
.photo-field input[type="text"], .photo-field input[type="number"] {
  width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  color: var(--text); font-family: 'Space Mono', monospace; font-size: 1.05rem;
  padding: 11px 12px;
}
.photo-field input:focus { outline: none; border-color: var(--photo-red); }

.photo-upload-btn {
  display: block; width: 100%; text-align: center; padding: 16px;
  background: var(--panel); border: 1.5px dashed var(--line); border-radius: 6px;
  color: var(--text-dim); font-family: 'Barlow Condensed', sans-serif; font-weight: 600;
  font-size: 1.05rem; cursor: pointer; margin-bottom: 16px;
}
.photo-upload-btn.has-image { border-style: solid; border-color: var(--photo-red); color: var(--text); }
#photoFileInput { display: none; }

#photoCanvasWrap {
  display: none; margin-bottom: 16px; border-radius: 6px; overflow: hidden;
  border: 1px solid var(--line); background: #000;
}
#photoCanvas { display: block; width: 100%; height: auto; }

.photo-actions { display: none; gap: 10px; margin-bottom: 20px; }
.photo-actions button {
  flex: 1; padding: 13px; border: none; border-radius: 4px;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer;
}
#photoGenerateBtn { background: var(--photo-red); color: #fff; }
#photoSaveBtn { background: var(--steel); color: #0d0d0d; }
.photo-hint { font-size: 0.8rem; color: var(--text-dim); text-align: center; margin-top: -8px; margin-bottom: 16px; display: none; }

/* Today tab tools, targets, records, rest timer */
.log-tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: -4px 0 14px; }
.log-tools button {
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px; color: var(--text-dim);
  font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 0.9rem; padding: 7px 12px; cursor: pointer;
}
.log-tools .hint { font-size: 0.78rem; color: var(--text-dim); text-align: right; }
.target-line { font-family: 'Space Mono', monospace; font-size: 0.72rem; color: var(--steel-light); margin-top: 2px; }
.mk { text-align: center; font-size: 0.95rem; color: var(--steel-light); }

.rest-bar {
  display: none; position: fixed; left: 0; right: 0; bottom: 80px; z-index: 5;
  align-items: center; gap: 10px; padding: 10px 18px; background: #1a1a1a; border-top: 1px solid var(--steel);
}
.rest-bar.show { display: flex; }
.rest-bar .rest-label { font-size: 0.9rem; color: var(--text-dim); font-weight: 600; }
.rest-bar .rest-time { font-family: 'Space Mono', monospace; font-size: 1.5rem; font-weight: 700; flex: 1; }
.rest-bar button {
  background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; color: var(--text);
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 0.95rem; padding: 8px 12px; cursor: pointer;
}
.rest-bar.done { background: var(--photo-red); border-top-color: var(--photo-red); }
.rest-bar.done .rest-label { color: #fff; }
body.rest-on { padding-bottom: 150px; }

/* Backup */
.backup-card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px; margin-top: 18px; }
.backup-card .b-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 4px; }
.backup-note { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 10px; }
.backup-note.warn { color: var(--rust); }
.backup-row { display: flex; gap: 10px; }
.backup-row button {
  flex: 1; padding: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; color: var(--text);
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer;
}

/* Weekly volume */
.vol-title { font-size: 1.2rem; font-weight: 600; }
.vol-sub { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 10px; }
.vol-row { display: grid; grid-template-columns: 96px 1fr 74px; gap: 8px; align-items: center; margin-bottom: 8px; }
.vol-name { font-size: 0.95rem; font-weight: 600; }
.vol-bar { position: relative; height: 8px; background: #2a2a2a; border-radius: 4px; }
.vol-fill { height: 100%; border-radius: 4px; background: var(--steel); }
.vol-fill.prio { background: var(--photo-red); }
.vol-tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: 0.7; }
.vol-num { font-family: 'Space Mono', monospace; font-size: 0.72rem; color: var(--text-dim); text-align: right; }

/* Before / After */
.cmp-section { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); }
.cmp-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 12px; }
.cmp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cmp-side .photo-upload-btn { padding: 14px 6px; font-size: 0.95rem; }
#cmpCanvasWrap { display: none; margin-bottom: 16px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: #000; }
#cmpCanvas { display: block; width: 100%; height: auto; }
#cmpGenerateBtn { background: var(--photo-red); color: #fff; }
#cmpSaveBtn { background: var(--steel); color: #0d0d0d; }
.head-btns { display: flex; align-items: center; gap: 8px; }
.rest-start {
  background: var(--panel2); border: 1px solid var(--steel); border-radius: 4px; color: var(--steel-light);
  font-family: 'Space Mono', monospace; font-weight: 700; font-size: 0.85rem; padding: 7px 10px; cursor: pointer;
}
</style>
</head>
<body>

<header>
  <h1>Workout Log</h1>
  <span class="date" id="todayLabel"></span>
</header>

<div class="tabs">
  <button class="tab active" id="tabLog" onclick="switchTab('log')">Today</button>
  <button class="tab" id="tabHistory" onclick="switchTab('history')">History</button>
  <button class="tab" id="tabProgress" onclick="switchTab('progress')">Progress</button>
  <button class="tab" id="tabPhoto" onclick="switchTab('photo')">Photo</button>
</div>

<div id="log">
  <div class="day-buttons" id="dayButtons"></div>
  <div class="log-tools">
    <button id="restToggle" onclick="toggleRestAuto()">⏱ Auto-start: OFF</button>
    <span class="hint">🏆 new record · ↑ better than last time</span>
  </div>
  <div id="exerciseList"></div>

  <div class="add-exercise-row">
    <input type="text" id="newExerciseName" placeholder="Exercise name" onkeydown="if(event.key==='Enter')addExercise()"/>
    <button onclick="addExercise()">Add</button>
  </div>
</div>

<div id="history">
  <div id="historyList"></div>
  <div class="backup-card">
    <div class="b-title">Backup</div>
    <div class="backup-note" id="backupNote"></div>
    <div class="backup-row">
      <button onclick="exportBackup()">⬇ Export</button>
      <button onclick="document.getElementById('importFile').click()">⬆ Import</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importBackup(event)"/>
  </div>
</div>

<div id="progress">
  <div id="heatmapWrap"></div>
  <div id="volumeWrap"></div>
  <div id="progressList"></div>
</div>

<div id="photo">
  <label class="photo-upload-btn" id="photoUploadLabel" for="photoFileInput">📷 Επίλεξε φωτογραφία</label>
  <input type="file" id="photoFileInput" accept="image/*" onchange="onPhotoSelected(event)"/>

  <div class="photo-field">
    <label for="photoDay">Μέρα</label>
    <input type="text" id="photoDay" placeholder="DAY 1"/>
  </div>
  <div class="photo-field">
    <label for="photoWeight">Κιλά</label>
    <input type="number" inputmode="decimal" id="photoWeight" placeholder="π.χ. 110.8"/>
  </div>

  <div class="photo-actions" id="photoActionsPre" style="display:none;">
    <button id="photoGenerateBtn" onclick="generatePhotoOverlay()">Δημιούργησε</button>
  </div>

  <div id="photoCanvasWrap"><canvas id="photoCanvas"></canvas></div>
  <div class="photo-hint" id="photoSaveHint">Πάτα κρατημένο πάνω στη φωτό για να την αποθηκεύσεις, ή χρησιμοποίησε το κουμπί.</div>

  <div class="photo-actions" id="photoActionsPost">
    <button id="photoSaveBtn" onclick="savePhotoToDevice()">💾 Αποθήκευση στη συσκευή</button>
  </div>

  <div class="cmp-section">
    <div class="cmp-title">Before / After</div>
    <div class="cmp-grid">
      <div class="cmp-side">
        <label class="photo-upload-btn" id="cmpLabelA" for="cmpFileA">📷 Before</label>
        <input type="file" id="cmpFileA" accept="image/*" style="display:none" onchange="onCompareSelected('A', event)"/>
        <div class="photo-field"><label for="cmpDayA">Μέρα</label><input type="text" id="cmpDayA" placeholder="DAY 1"/></div>
        <div class="photo-field"><label for="cmpWeightA">Κιλά</label><input type="number" inputmode="decimal" id="cmpWeightA" placeholder="110.8"/></div>
      </div>
      <div class="cmp-side">
        <label class="photo-upload-btn" id="cmpLabelB" for="cmpFileB">📷 After</label>
        <input type="file" id="cmpFileB" accept="image/*" style="display:none" onchange="onCompareSelected('B', event)"/>
        <div class="photo-field"><label for="cmpDayB">Μέρα</label><input type="text" id="cmpDayB" placeholder="DAY 30"/></div>
        <div class="photo-field"><label for="cmpWeightB">Κιλά</label><input type="number" inputmode="decimal" id="cmpWeightB" placeholder="105.2"/></div>
      </div>
    </div>
    <div class="photo-actions" id="cmpActionsPre">
      <button id="cmpGenerateBtn" onclick="generateCompare()">Δημιούργησε</button>
    </div>
    <div id="cmpCanvasWrap"><canvas id="cmpCanvas"></canvas></div>
    <div class="photo-actions" id="cmpActionsPost">
      <button id="cmpSaveBtn" onclick="saveCompareToDevice()">💾 Αποθήκευση στη συσκευή</button>
    </div>
  </div>
</div>

<div class="rest-bar" id="restBar">
  <span class="rest-label">Rest</span>
  <span class="rest-time" id="restTime">0:00</span>
  <button onclick="adjustRest(-15)">−15</button>
  <button onclick="adjustRest(15)">+15</button>
  <button onclick="stopRest()">Skip</button>
</div>

<div class="finish-bar">
  <button id="finishBtn" onclick="finishWorkout()" disabled>Finish Workout</button>
</div>

<script>
const DAY_PLAN = [
  { label: 'Day 1 — Push (Chest)', ex: [
    ['Incline DB Press', '4×8-10'], ['Flat Bench Press', '4×6-8'], ['Cable Fly', '3×12-15'],
    ['Overhead Press', '3×8-10'], ['Lateral Raise', '3×12-15'],
    ['Overhead Triceps Extension', '3×10-12'], ['Triceps Pushdown', '3×12-15'] ] },
  { label: 'Day 2 — Pull', ex: [
    ['Wide-Grip Pull-ups', '4×6-10'], ['Barbell Row', '3×8-10'], ['Face Pull', '3×15'],
    ['Barbell Shrugs', '4×10-12'], ['Incline DB Curl', '4×10-12'], ['Hammer Curl', '3×12-15'],
    ['Reverse Curl', '2×12-15'], ['Neck Curl', '2×15'] ] },
  { label: 'Day 3 — Legs (Glutes)', ex: [
    ['Barbell Hip Thrust', '4×8-10'], ['Back Squat', '4×6-8'], ['Romanian Deadlift', '3×8-10'],
    ['Leg Curl', '3×12-15'], ['Calf Raise', '3×12-15'], ['Hanging Leg Raise', '3×12-15'], ['Cable Crunch', '3×15-20'] ] },
  { label: 'Day 4 — Upper', ex: [
    ['Incline Bench Press', '3×8-10'], ['Seated Cable Row', '3×8-10'], ['Chest Dips', '3×10-12'],
    ['Lat Pulldown', '3×10-12'], ['Lateral Raise', '3×12-15'], ['Rear Delt Fly', '3×15-20'], ['Close-Grip Bench Press', '3×8-10'], ['EZ-Bar Curl', '3×8-10'] ] },
  { label: 'Day 5 — Lower', ex: [
    ['Bulgarian Split Squat', '3×10-12/leg'], ['Cable Pull-Through', '3×10-12'], ['Leg Press', '3×10-12'], ['Leg Extension', '3×12-15'], ['Cable Hip Abduction', '3×15/leg'],
    ['Weighted Back Extension', '3×12-15'], ['Standing Calf Raise', '4×15-20'],
    ['Ab Wheel Rollout', '3×12-15'], ['Cable Woodchopper', '3×12-15/side'] ] }
];
const DAY_TEMPLATES = DAY_PLAN.map(d => ({ label: d.label, exercises: d.ex.map(e => e[0]) }));
const TARGET_BY_NAME = {};
DAY_PLAN.forEach(d => d.ex.forEach(([n, t]) => { TARGET_BY_NAME[n.toLowerCase()] = t; }));

const STORAGE_KEY = 'workoutLog_sessions';
const DRAFT_KEY = 'workoutLog_draft';

function todayStr() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

function loadSessions() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { return []; }
}
function saveSessions(sessions) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
}
function loadDraft() {
  try { return JSON.parse(localStorage.getItem(DRAFT_KEY)) || { date: todayStr(), exercises: [] }; }
  catch(e) { return { date: todayStr(), exercises: [] }; }
}
function saveDraft(draft) {
  localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
}

let draft = loadDraft();
// If the draft is from a previous day, start a fresh one (yesterday's unfinished workout stays lost by design - simple single-device tool)
if (draft.date !== todayStr()) {
  draft = { date: todayStr(), exercises: [] };
  saveDraft(draft);
}

document.getElementById('todayLabel').textContent = todayStr();

// Bodyweight exercises: reps only is enough (kg stays 0 unless you add weight).
const BW_NAMES = ['hanging leg raise', 'ab wheel rollout', 'wide-grip pull-ups', 'chest dips'];
function isBW(name) { return BW_NAMES.includes(String(name).toLowerCase()); }
function fmtSet(name, s) {
  const kg = parseFloat(s.kg) || 0;
  return (isBW(name) && kg === 0) ? `BW×${s.reps}` : `${s.kg}kg×${s.reps}`;
}

function findLastTime(exerciseName) {
  const sessions = loadSessions();
  for (let i = sessions.length - 1; i >= 0; i--) {
    const match = sessions[i].exercises.find(ex => ex.name.toLowerCase() === exerciseName.toLowerCase());
    if (match && match.sets.length) {
      return match.sets.map(s => fmtSet(match.name, s)).join(', ');
    }
  }
  return null;
}

function renderDayButtons() {
  const container = document.getElementById('dayButtons');
  container.innerHTML = DAY_TEMPLATES.map((day, idx) =>
    `<button class="day-btn" onclick="loadDay(${idx})">${day.label}</button>`
  ).join('');
}

function loadDay(dayIdx) {
  const plan = DAY_PLAN[dayIdx];
  const existingNames = draft.exercises.map(ex => ex.name.toLowerCase());
  plan.ex.forEach(([name, target]) => {
    if (!existingNames.includes(name.toLowerCase())) {
      const n = (parseTarget(target) || { sets: 1 }).sets;
      draft.exercises.push({ name, sets: Array.from({ length: n }, () => ({ kg: '', reps: '' })) });
    }
  });
  saveDraft(draft);
  renderLog();
}

function addExercise() {
  const input = document.getElementById('newExerciseName');
  const name = input.value.trim();
  if (!name) return;
  draft.exercises.push({ name, sets: [{ kg: '', reps: '' }] });
  input.value = '';
  saveDraft(draft);
  renderLog();
}

function removeExercise(exIdx) {
  draft.exercises.splice(exIdx, 1);
  saveDraft(draft);
  renderLog();
}

function addSet(exIdx) {
  const sets = draft.exercises[exIdx].sets;
  const prev = sets[sets.length - 1];
  sets.push({ kg: prev ? prev.kg : '', reps: prev ? prev.reps : '' });
  saveDraft(draft);
  renderLog();
}

function removeSet(exIdx, setIdx) {
  draft.exercises[exIdx].sets.splice(setIdx, 1);
  if (draft.exercises[exIdx].sets.length === 0) draft.exercises.splice(exIdx, 1);
  saveDraft(draft);
  renderLog();
}

function updateSet(exIdx, setIdx, field, value) {
  const ex = draft.exercises[exIdx];
  const set = ex.sets[setIdx];
  const wasComplete = set.kg !== '' && set.reps !== '';
  set[field] = value;
  if (field === 'reps' && value !== '' && set.kg === '' && isBW(ex.name)) set.kg = '0';
  saveDraft(draft);
  updateFinishButton();

  const mk = document.getElementById(`mk_${exIdx}_${setIdx}`);
  if (mk) mk.textContent = setMarker(ex.name, setIdx, set.kg, set.reps);

  const nowComplete = set.kg !== '' && set.reps !== '';
  if (!wasComplete && nowComplete && restAutoOn()) startRest(restSecondsFor(ex.name));
}

function updateFinishButton() {
  const hasData = draft.exercises.some(ex => ex.sets.some(s => s.kg !== '' && s.reps !== ''));
  document.getElementById('finishBtn').disabled = !hasData;
}

function renderLog() {
  const container = document.getElementById('exerciseList');
  if (draft.exercises.length === 0) {
    container.innerHTML = '<div class="empty-state">No exercises yet. Add your first one below.</div>';
    updateFinishButton();
    return;
  }

  container.innerHTML = draft.exercises.map((ex, exIdx) => {
    const lastTime = findLastTime(ex.name);
    const lastSets = findLastSets(ex.name);
    const target = TARGET_BY_NAME[ex.name.toLowerCase()];
    const setsHtml = ex.sets.map((s, setIdx) => {
      const ls = lastSets[setIdx];
      const phKg = isBW(ex.name) ? ((ls && parseFloat(ls.kg) > 0) ? ls.kg : 'BW') : (ls ? ls.kg : 0), phReps = ls ? ls.reps : 0;
      return `
      <div class="set-row">
        <span class="set-num">${setIdx + 1}</span>
        <div>
          <input type="number" inputmode="decimal" placeholder="${phKg}" value="${s.kg}"
            onchange="updateSet(${exIdx},${setIdx},'kg',this.value)"/>
          <span class="unit">kg</span>
        </div>
        <div>
          <input type="number" inputmode="numeric" placeholder="${phReps}" value="${s.reps}"
            onchange="updateSet(${exIdx},${setIdx},'reps',this.value)"/>
          <span class="unit">reps</span>
        </div>
        <span class="mk" id="mk_${exIdx}_${setIdx}">${setMarker(ex.name, setIdx, s.kg, s.reps)}</span>
        <button class="remove-set" onclick="removeSet(${exIdx},${setIdx})">✕</button>
      </div>`;
    }).join('');

    return `
      <div class="exercise">
        <div class="exercise-head">
          <div>
            <h3>${esc(ex.name)}</h3>
            ${target ? `<div class="target-line">Target ${esc(target)}</div>` : ''}
            ${lastTime ? `<div class="last-time">Last: ${lastTime}</div>` : ''}
          </div>
          <div class="head-btns">
            <button class="rest-start" onclick="startRest(${restSecondsFor(ex.name)})">⏱ ${fmtClock(restSecondsFor(ex.name))}</button>
            <button class="remove-ex" onclick="removeExercise(${exIdx})">✕</button>
          </div>
        </div>
        ${setsHtml}
        <button class="add-set-btn" onclick="addSet(${exIdx})">+ Add set</button>
      </div>
    `;
  }).join('');

  updateFinishButton();
}

function finishWorkout() {
  const cleanExercises = draft.exercises
    .map(ex => ({ name: ex.name, sets: ex.sets.filter(s => s.kg !== '' && s.reps !== '') }))
    .filter(ex => ex.sets.length > 0);

  if (cleanExercises.length === 0) return;

  const sessions = loadSessions();
  sessions.push({ date: draft.date, exercises: cleanExercises });
  saveSessions(sessions);

  localStorage.removeItem(DRAFT_KEY);
  draft = { date: todayStr(), exercises: [] };
  renderLog();
  renderHistory();
  switchTab('history');
}

function renderHistory() {
  const sessions = loadSessions();
  const container = document.getElementById('historyList');
  if (sessions.length === 0) {
    container.innerHTML = '<div class="empty-state">No finished workouts yet.</div>';
    return;
  }
  // Show newest first, but keep each session's real index into the stored array
  // (editSession/removeSession need the real index, not the reversed display position).
  const withIndex = sessions.map((session, idx) => ({ session, idx }));
  const reversed = withIndex.slice().reverse();

  container.innerHTML = reversed.map(({ session, idx }) => `
    <div class="history-session">
      <div class="h-top">
        <div class="h-date">${session.date}</div>
        <button class="edit-session-btn" onclick="editSession(${idx})">✎ Edit</button>
      </div>
      ${session.exercises.map(ex => `
        <div class="history-ex">
          <div class="h-name">${ex.name}</div>
          <div class="h-sets">${ex.sets.map(s => fmtSet(ex.name, s)).join(', ')}</div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function editSession(originalIndex) {
  const sessions = loadSessions();
  const session = sessions[originalIndex];
  if (!session) return;

  // If there's already unsaved work in today's draft, make sure the user doesn't lose it silently.
  const draftHasData = draft.exercises.some(ex => ex.sets.some(s => s.kg !== '' || s.reps !== ''));
  if (draftHasData) {
    const ok = confirm('This will replace what\'s currently in Today with this finished workout so you can edit it. Continue?');
    if (!ok) return;
  }

  // Pull the session back out of history...
  sessions.splice(originalIndex, 1);
  saveSessions(sessions);

  // ...and load it into today's editable draft, re-dating it to today so it behaves like a normal in-progress workout.
  draft = {
    date: todayStr(),
    exercises: session.exercises.map(ex => ({
      name: ex.name,
      sets: ex.sets.map(s => ({ kg: s.kg, reps: s.reps }))
    }))
  };
  saveDraft(draft);

  renderLog();
  renderHistory();
  switchTab('log');
}

function buildProgressData() {
  const sessions = loadSessions(); // chronological order (oldest first, since we append)
  const byExercise = {};

  sessions.forEach(session => {
    session.exercises.forEach(ex => {
      const maxKg = Math.max(...ex.sets.map(s => parseFloat(s.kg) || 0));
      const topSet = ex.sets.reduce((best, s) => (parseFloat(s.kg) || 0) >= maxKg ? s : best, ex.sets[0]);
      const key = ex.name.toLowerCase();
      if (!byExercise[key]) byExercise[key] = { name: ex.name, points: [] };
      const bw = maxKg === 0 && isBW(ex.name);
      if (bw) { byExercise[key].bw = true; }
      byExercise[key].points.push({ date: session.date, kg: bw ? Math.max(...ex.sets.map(s => parseInt(s.reps, 10) || 0)) : maxKg, reps: topSet.reps });
    });
  });

  return Object.values(byExercise).filter(ex => ex.points.length >= 2);
}

function lineChartSVG(points) {
  const w = 300, h = 70, pad = 6;
  const kgValues = points.map(p => p.kg);
  const min = Math.min(...kgValues), max = Math.max(...kgValues);
  const range = (max - min) || 1;

  const coords = points.map((p, i) => {
    const x = pad + (i / (points.length - 1)) * (w - pad * 2);
    const y = h - pad - ((p.kg - min) / range) * (h - pad * 2);
    return [x, y];
  });

  const pathD = coords.map((c, i) => `${i === 0 ? 'M' : 'L'}${c[0].toFixed(1)},${c[1].toFixed(1)}`).join(' ');
  const dots = coords.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="#5b8a9a"/>`).join('');

  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${pathD}" fill="none" stroke="#5b8a9a" stroke-width="2" vector-effect="non-scaling-stroke"/>
    ${dots}
  </svg>`;
}

/* ---------- Workout calendar (heatmap) ---------- */
function parseSessionDate(str) {
  const [d, m, y] = String(str).split('/').map(Number);
  return new Date(y, m - 1, d);
}
function dayKey(dt) { return `${dt.getFullYear()}-${dt.getMonth() + 1}-${dt.getDate()}`; }

function renderHeatmap() {
  const wrap = document.getElementById('heatmapWrap');
  const workoutDays = new Set();
  const now = new Date();
  const years = new Set([now.getFullYear()]);

  loadSessions().forEach(s => {
    const dt = parseSessionDate(s.date);
    if (!isNaN(dt)) { workoutDays.add(dayKey(dt)); years.add(dt.getFullYear()); }
  });
  // an unfinished workout with data in it still counts for today
  if (draft.exercises.some(ex => ex.sets.some(s => s.kg !== '' && s.reps !== ''))) {
    const dt = parseSessionDate(draft.date);
    if (!isNaN(dt)) workoutDays.add(dayKey(dt));
  }

  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const step = 11, size = 8.5, labelH = 16;
  const todayKey = dayKey(now);
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  const yearsHtml = [...years].sort((a, b) => b - a).map(year => {
    const offset = (new Date(year, 0, 1).getDay() + 6) % 7; // Monday = row 0
    const total = Math.round((new Date(year, 11, 31) - new Date(year, 0, 1)) / 86400000) + 1;
    const cols = Math.floor((offset + total - 1) / 7) + 1;
    let cells = '', labels = '', count = 0;

    for (let i = 0; i < total; i++) {
      const dt = new Date(year, 0, 1 + i);
      const idx = offset + i, col = Math.floor(idx / 7), row = idx % 7;
      const x = col * step, y = labelH + row * step;
      const key = dayKey(dt);
      const on = workoutDays.has(key);
      if (on) count++;
      const cls = on ? 'hm-on' : (dt > todayMid ? 'hm-future' : 'hm-off');
      const outline = key === todayKey ? ' stroke="#e8e8e4" stroke-width="1"' : '';
      cells += `<rect class="${cls}" x="${x}" y="${y}" width="${size}" height="${size}" rx="2"${outline}/>`;
      if (dt.getDate() === 1) labels += `<text class="hm-month" x="${x}" y="11">${monthNames[dt.getMonth()]}</text>`;
    }

    return `
      <div class="heatmap-year">
        <div class="heatmap-head"><span class="hm-year">${year}</span><span class="hm-count">${count} workouts</span></div>
        <svg viewBox="0 0 ${cols * step} ${labelH + 7 * step}">${labels}${cells}</svg>
      </div>`;
  }).join('');

  wrap.innerHTML = `
    <div class="heatmap-card">
      ${yearsHtml}
      <div class="heatmap-legend">
        <span><i style="background:#2a2a2a"></i>Rest days</span>
        <span><i style="background:var(--steel-light)"></i>Workout days</span>
      </div>
    </div>`;
}

function renderProgress() {
  renderHeatmap();
  renderWeeklyVolume();
  const data = buildProgressData();
  const container = document.getElementById('progressList');

  if (data.length === 0) {
    container.innerHTML = '<div class="empty-state">Not enough history yet. Log the same exercise across 2+ workouts to see progress.</div>';
    return;
  }

  container.innerHTML = data.map(ex => {
    const first = ex.points[0], last = ex.points[ex.points.length - 1];
    const diff = last.kg - first.kg;
    const changeClass = diff > 0 ? '' : 'flat';
    const u = ex.bw ? ' reps' : 'kg';
    const changeText = diff > 0 ? `+${diff}${u} since first logged` : (diff < 0 ? `${diff}${u} since first logged` : 'No change yet');

    return `
      <div class="progress-card">
        <div class="p-name">${ex.name}</div>
        <div class="p-change ${changeClass}">${first.kg}${u} → ${last.kg}${u} (${changeText})</div>
        ${lineChartSVG(ex.points)}
        <div class="p-points"><span>${first.date}</span><span>${last.date}</span></div>
      </div>
    `;
  }).join('');
}

function ensureFonts() {

// Draws the gradient + "DAY X / weight kg / date" overlay inside a W x H box whose top-left is (ox, oy).
function drawOverlay(ctx, ox, oy, W, H, dayLabel, weightText, dateText) {
  ctx.save();
  ctx.translate(ox, oy);

  const gradH = H * 0.30;
  const gradient = ctx.createLinearGradient(0, H - gradH, 0, H);
  gradient.addColorStop(0, 'rgba(8,4,4,0)');
  gradient.addColorStop(1, 'rgba(8,4,4,0.92)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, H - gradH, W, gradH);

  const margin = W * 0.046;
  const redColor = '#e5393b';

  const labelFontSize = Math.round(H * 0.0198);
  ctx.font = `700 ${labelFontSize}px 'Poppins', sans-serif`;
  ctx.fillStyle = redColor;
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  const labelY = H - H * 0.164;
  let lx = margin;
  for (const ch of dayLabel.split('').join(' ')) {
    ctx.fillText(ch, lx, labelY);
    lx += ctx.measureText(ch).width + labelFontSize * 0.28;
  }
  const labelWidth = lx - margin - labelFontSize * 0.28;
  ctx.fillRect(margin, labelY + labelFontSize * 0.22, labelWidth, Math.max(2, H * 0.002));

  const numFontSize = Math.round(H * 0.0745);
  ctx.font = `800 ${numFontSize}px 'Poppins', sans-serif`;
  ctx.fillStyle = '#ffffff';
  const numY = H - H * 0.055;
  ctx.fillText(weightText, margin, numY);
  const numWidth = ctx.measureText(weightText).width;

  const unitFontSize = Math.round(H * 0.0228);
  ctx.font = `700 ${unitFontSize}px 'Poppins', sans-serif`;
  ctx.fillStyle = redColor;
  ctx.fillText('kg', margin + numWidth + numFontSize * 0.09, numY);

  if (dateText) {
    const dateFontSize = Math.round(H * 0.0149);
    ctx.font = `600 ${dateFontSize}px 'Poppins', sans-serif`;
    ctx.fillStyle = '#bebebe';
    const dateWidth = ctx.measureText(dateText).width;
    ctx.fillText(dateText, W - margin - dateWidth, H - H * 0.03);
  }
  ctx.restore();
}

async function generatePhotoOverlay() {
  if (!selectedPhotoImg) return;
  await ensureFonts();
  const dayLabel = (document.getElementById('photoDay').value || 'DAY 1').trim().toUpperCase();
  const weightVal = document.getElementById('photoWeight').value.trim();

  const img = selectedPhotoImg;
  const canvas = document.getElementById('photoCanvas');
  const W = img.naturalWidth, H = img.naturalHeight;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, W, H);
  drawOverlay(ctx, 0, 0, W, H, dayLabel, weightVal || '--', todayLabelDots());

  document.getElementById('photoCanvasWrap').style.display = 'block';
  document.getElementById('photoActionsPost').style.display = 'flex';
  document.getElementById('photoSaveHint').style.display = 'block';

  if (weightVal) localStorage.setItem(PHOTO_LAST_WEIGHT_KEY, weightVal);
}

function saveCanvasToDevice(canvas, filename, onSaved) {
  canvas.toBlob(async (blob) => {
    if (!blob) return;
    const file = new File([blob], filename, { type: 'image/jpeg' });

    // Prefer the native share sheet on mobile, which includes "Save Image".
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file] });
        if (onSaved) onSaved();
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return; // user closed the share sheet
      }
    }

    // Fallback: direct download.
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    if (onSaved) onSaved();
  }, 'image/jpeg', 0.92);
}

function savePhotoToDevice() {
  const canvas = document.getElementById('photoCanvas');
  const dayLabel = (document.getElementById('photoDay').value || 'day').trim().toLowerCase().replace(/\s+/g, '-');
  saveCanvasToDevice(canvas, `progress-${dayLabel}.jpg`, bumpPhotoCount);

/* ---------- Targets, records, rest timer ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function parseTarget(t) {
  const m = /^(\d+)×(\d+)(?:-(\d+))?/.exec(t || '');
  if (!m) return null;
  return { sets: parseInt(m[1], 10), repsLo: parseInt(m[2], 10), repsHi: parseInt(m[3] || m[2], 10) };
}

function exerciseHistory(name) {
  const key = name.toLowerCase();
  return loadSessions().map(s => s.exercises.find(e => e.name.toLowerCase() === key)).filter(Boolean);
}

function findLastSets(name) {
  const h = exerciseHistory(name);
  return h.length ? h[h.length - 1].sets : [];
}

// 🏆 = heavier than ever (or same weight, more reps); ↑ = better than the same set last time.
function setMarker(name, setIdx, kgStr, repsStr) {
  const kg = parseFloat(kgStr), reps = parseInt(repsStr, 10);
  if (!(isBW(name) ? kg >= 0 : kg > 0) || !(reps > 0)) return '';
  const hist = exerciseHistory(name);
  if (!hist.length) return '';

  let bestKg = 0, bestReps = 0;
  hist.forEach(e => e.sets.forEach(s => {
    const k = parseFloat(s.kg) || 0, r = parseInt(s.reps, 10) || 0;
    if (k > bestKg || (k === bestKg && r > bestReps)) { bestKg = k; bestReps = r; }
  }));
  if (kg > bestKg || (kg === bestKg && reps > bestReps)) return '🏆';

  const last = hist[hist.length - 1].sets[setIdx];
  if (last) {
    const lk = parseFloat(last.kg) || 0, lr = parseInt(last.reps, 10) || 0;
    if (kg > lk || (kg === lk && reps > lr)) return '↑';
  }
  return '';
}

const REST_KEY = 'workoutLog_restAuto';
let restEnd = 0, restTimer = null, restAudio = null, restToken = 0;

function restAutoOn() { return localStorage.getItem(REST_KEY) === 'on'; }
function renderRestToggle() {
  document.getElementById('restToggle').textContent = '⏱ Auto-start: ' + (restAutoOn() ? 'ON' : 'OFF');
}

// Heavier / lower-rep work gets longer rest, same idea as the plan: compounds 2-3 min, isolation ~1 min.
const REST_BY_NAME = {
  'incline db press':150,'flat bench press':180,'cable fly':75,'overhead press':150,'lateral raise':60,
  'overhead triceps extension':75,'triceps pushdown':60,
  'wide-grip pull-ups':150,'barbell row':150,'face pull':60,'barbell shrugs':90,'incline db curl':75,'hammer curl':60,
  'barbell hip thrust':150,'back squat':180,'romanian deadlift':150,'leg curl':75,'calf raise':60,
  'hanging leg raise':75,'cable crunch':60,
  'incline bench press':150,'seated cable row':120,'chest dips':120,'lat pulldown':120,'rear delt fly':60,
  'close-grip bench press':120,'ez-bar curl':75,
  'bulgarian split squat':120,'cable pull-through':90,'leg press':120,'reverse curl':60,'neck curl':60,'cable hip abduction':60,'leg extension':75,'weighted back extension':90,
  'standing calf raise':60,'ab wheel rollout':75,'cable woodchopper':60
};
function restSecondsFor(name) { return REST_BY_NAME[name.toLowerCase()] || 90; }

function fmtClock(sec) { return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; }

function startRest(sec) {
  restToken++;
  restEnd = Date.now() + sec * 1000;
  const bar = document.getElementById('restBar');
  bar.classList.add('show');
  bar.classList.remove('done');
  document.body.classList.add('rest-on');
  clearInterval(restTimer);
  restTimer = setInterval(tickRest, 250);
  tickRest();
}

function tickRest() {
  const left = Math.ceil((restEnd - Date.now()) / 1000);
  if (left <= 0) { restDone(); return; }
  document.getElementById('restTime').textContent = fmtClock(left);
}

function restDone() {
  clearInterval(restTimer);
  restTimer = null;
  document.getElementById('restBar').classList.add('done');
  document.getElementById('restTime').textContent = 'GO';
  beep();
  const token = restToken;
  setTimeout(() => { if (token === restToken) stopRest(); }, 8000);
}

function adjustRest(delta) {
  if (!restTimer) return;
  restEnd += delta * 1000;
  tickRest();
}

function stopRest() {
  restToken++;
  clearInterval(restTimer);
  restTimer = null;
  document.getElementById('restBar').classList.remove('show', 'done');
  document.body.classList.remove('rest-on');
}

function initAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    restAudio = restAudio || new AC();
    if (restAudio.state === 'suspended') restAudio.resume();
  } catch (e) {}
}
function beep() {
  try {
    if (restAudio) {
      const o = restAudio.createOscillator(), g = restAudio.createGain();
      o.connect(g); g.connect(restAudio.destination);
      o.frequency.value = 880; g.gain.value = 0.15;
      o.start(); o.stop(restAudio.currentTime + 0.25);
    }
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
}
// Browsers only allow sound after a tap, so unlock audio on the first touch.
document.addEventListener('touchstart', initAudio, { once: true });
document.addEventListener('click', initAudio, { once: true });

/* ---------- Backup ---------- */
const LAST_BACKUP_KEY = 'workoutLog_lastBackup';

function collectBackup() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('workoutLog_')) data[k] = localStorage.getItem(k);
  }
  return { app: 'workout-tracker', version: 1, exportedAt: new Date().toISOString(), data };
}

function renderBackupNote() {
  const el = document.getElementById('backupNote');
  const last = localStorage.getItem(LAST_BACKUP_KEY);
  let warn = !last;
  if (last) {
    const days = (new Date() - parseSessionDate(last)) / 86400000;
    warn = days > 14;
  }
  el.classList.toggle('warn', warn);
  el.textContent = last
    ? `${warn ? '⚠ ' : ''}Last backup: ${last}`
    : '⚠ No backup yet. Everything is stored only on this phone.';
}

function exportBackup() {
  const json = JSON.stringify(collectBackup());
  const fname = `workout-backup-${todayStr().split('/').reverse().join('-')}.json`;
  const blob = new Blob([json], { type: 'application/json' });
  const file = new File([blob], fname, { type: 'application/json' });
  const done = () => { localStorage.setItem(LAST_BACKUP_KEY, todayStr()); renderBackupNote(); };

  const download = () => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    done();
  };

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file] }).then(done).catch(err => { if (!err || err.name !== 'AbortError') download(); });
  } else {
    download();
  }
}

function importBackup(event) {
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let obj;
    try { obj = JSON.parse(reader.result); } catch (e) { obj = null; }
    if (!obj || obj.app !== 'workout-tracker' || !obj.data || typeof obj.data !== 'object') {
      alert('This is not a valid workout backup file.');
      return;
    }
    let count = 0;
    try { count = (JSON.parse(obj.data[STORAGE_KEY] || '[]') || []).length; } catch (e) {}
    if (!confirm(`Replace everything on this phone with this backup (${count} workouts)?`)) return;

    Object.keys(localStorage).filter(k => k.startsWith('workoutLog_')).forEach(k => localStorage.removeItem(k));
    Object.keys(obj.data).filter(k => k.startsWith('workoutLog_')).forEach(k => localStorage.setItem(k, obj.data[k]));
    location.reload();
  };
  reader.readAsText(file);
}

/* ---------- Weekly volume per muscle ---------- */

  ['biceps', 'Biceps', false], ['forearms', 'Forearms', false], ['triceps', 'Triceps', false], ['quads', 'Quads', false],
  ['hamstrings', 'Hamstrings', false], ['glutes', 'Glutes', true], ['calves', 'Calves', false], ['abs', 'Abs', true]

const MUSCLE_MAP = {
  'incline db press': { chest: 1, triceps: 0.5, shoulders: 0.5 },
  'flat bench press': { chest: 1, triceps: 0.5, shoulders: 0.5 },
  'cable fly': { chest: 1 },
  'incline bench press': { chest: 1, triceps: 0.5, shoulders: 0.5 },
  'chest dips': { chest: 1, triceps: 0.5 },

  'barbell row': { back: 1, biceps: 0.5 },

  'barbell shrugs': { back: 1 },
  'incline db curl': { biceps: 1 },
  'hammer curl': { biceps: 1, forearms: 0.5 },

  'standing calf raise': { calves: 1 },

  'cable pull-through': { glutes: 1, hamstrings: 0.5 },

  'leg extension': { quads: 1 },
  'weighted back extension': { glutes: 0.5, hamstrings: 0.5 },
  'hanging leg raise': { abs: 1 },
  'cable crunch': { abs: 1 },
  'ab wheel rollout': { abs: 1 },
  'cable woodchopper': { abs: 1 }
};

function plannedVolume() {
  const p = {};
  DAY_PLAN.forEach(d => d.ex.forEach(([n, t]) => {
    const pt = parseTarget(t), mm = MUSCLE_MAP[n.toLowerCase()];
    if (!pt || !mm) return;
    for (const m in mm) p[m] = (p[m] || 0) + pt.sets * mm[m];
  }));
  return p;
}

function weeklyVolume() {
  const now = new Date();
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
  const next = new Date(monday); next.setDate(monday.getDate() + 7);
  const done = {};
  const addEx = (ex) => {
    const mm = MUSCLE_MAP[ex.name.toLowerCase()];
    if (!mm) return;
    const n = ex.sets.filter(s => s.kg !== '' && s.reps !== '').length;
    for (const m in mm) done[m] = (done[m] || 0) + n * mm[m];
  };
  loadSessions().forEach(s => {
    const dt = parseSessionDate(s.date);
    if (dt >= monday && dt < next) s.exercises.forEach(addEx);
  });
  draft.exercises.forEach(addEx); // today's workout in progress
  return done;
}

function fmtSets(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }

function renderWeeklyVolume() {
  const planned = plannedVolume(), done = weeklyVolume();
  const rows = MUSCLES.map(([key, label, prio]) => {
    const p = planned[key] || 0, d = done[key] || 0;
    const scale = Math.max(p, d, 1);
    const fill = (d / scale * 100).toFixed(1), tick = (p / scale * 100).toFixed(1);
    return `
      <div class="vol-row">
        <div class="vol-name">${prio ? '★ ' : ''}${label}</div>
        <div class="vol-bar"><div class="vol-fill ${prio ? 'prio' : ''}" style="width:${fill}%"></div><div class="vol-tick" style="left:calc(${tick}% - 1px)"></div></div>
        <div class="vol-num">${fmtSets(d)} / ${fmtSets(p)}</div>
      </div>`;
  }).join('');
  document.getElementById('volumeWrap').innerHTML = `
    <div class="heatmap-card">
      <div class="vol-title">This week · sets</div>
      <div class="vol-sub">Done vs. your plan. Secondary muscles count ½. ★ = priority.</div>
      ${rows}
    </div>`;
}

/* ---------- Before / After ---------- */
const cmpImgs = { A: null, B: null };

function onCompareSelected(side, event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      cmpImgs[side] = img;
      const label = document.getElementById('cmpLabel' + side);
      label.textContent = '📷 ' + (side === 'A' ? 'Before ✓' : 'After ✓');
      label.classList.add('has-image');
      if (cmpImgs.A && cmpImgs.B) document.getElementById('cmpActionsPre').style.display = 'flex';
      document.getElementById('cmpCanvasWrap').style.display = 'none';
      document.getElementById('cmpActionsPost').style.display = 'none';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// Fill the box with the image (crop to cover), keeping the upper part of the photo a bit more.
function drawCover(ctx, img, dx, dy, dw, dh, focusY) {
  const s = Math.max(dw / img.naturalWidth, dh / img.naturalHeight);
  const sw = dw / s, sh = dh / s;
  const sx = (img.naturalWidth - sw) / 2;
  const sy = (img.naturalHeight - sh) * (focusY == null ? 0.35 : focusY);
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

async function generateCompare() {
  if (!cmpImgs.A || !cmpImgs.B) return;
  await ensureFonts();
  const pw = 1080, ph = 1440;
  const canvas = document.getElementById('cmpCanvas');
  canvas.width = pw * 2; canvas.height = ph;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, pw * 2, ph);

  ['A', 'B'].forEach((side, i) => {
    drawCover(ctx, cmpImgs[side], i * pw, 0, pw, ph);
    const day = (document.getElementById('cmpDay' + side).value || (i ? 'NOW' : 'BEFORE')).trim().toUpperCase();
    const w = document.getElementById('cmpWeight' + side).value.trim();
    drawOverlay(ctx, i * pw, 0, pw, ph, day, w || '--', '');
  });

  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(pw - 3, 0, 6, ph);

  const a = parseFloat(document.getElementById('cmpWeightA').value);
  const b = parseFloat(document.getElementById('cmpWeightB').value);
  if (!isNaN(a) && !isNaN(b)) {
    const diff = Math.round((b - a) * 10) / 10;
    const text = (diff > 0 ? '+' : diff < 0 ? '−' : '') + Math.abs(diff).toFixed(1) + ' kg';
    const fs = Math.round(ph * 0.036);
    ctx.font = `800 ${fs}px 'Poppins', sans-serif`;
    const tw = ctx.measureText(text).width;
    const padX = fs * 0.9, bh = fs * 1.9, bw = tw + padX * 2;
    const cx = pw, cy = ph * 0.075;
    roundRectPath(ctx, cx - bw / 2, cy - bh / 2, bw, bh, bh / 2);
    ctx.fillStyle = 'rgba(8,4,4,0.9)';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#e5393b';
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, cx, cy + fs * 0.05);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  document.getElementById('cmpCanvasWrap').style.display = 'block';
  document.getElementById('cmpActionsPost').style.display = 'flex';
}

function saveCompareToDevice() {
  const dayA = (document.getElementById('cmpDayA').value || 'before').trim().toLowerCase().replace(/\s+/g, '-');
  const dayB = (document.getElementById('cmpDayB').value || 'after').trim().toLowerCase().replace(/\s+/g, '-');
  saveCanvasToDevice(document.getElementById('cmpCanvas'), `before-after-${dayA}-vs-${dayB}.jpg`);
}
